---
layout: default
---
<article class="blog-post">
  <div class="blog-post-inner">
    <header class="blog-post-header reveal">
      <div class="section-eyebrow">
        <div class="eyebrow-line"></div>
        <span class="eyebrow-text">WeruLux Journal</span>
      </div>
      <h1 class="blog-post-title">{{ page.title }}</h1>
      <div class="blog-post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
        {% if page.author %}<span class="blog-post-author">· {{ page.author }}</span>{% endif %}
      </div>
    </header>

    {% if page.cover %}
    <div class="blog-post-cover reveal">
      <img src="{{ page.cover | relative_url }}" alt="{{ page.title }}">
    </div>
    {% endif %}

    <div class="blog-post-content reveal reveal-delay-1">
      {{ content }}
    </div>

    <div class="blog-post-footer reveal">
      <a href="{{ '/blog/' | relative_url }}" class="btn-primary blog-back-link" style="color:#fff;">Back to all articles</a>
    </div>
  </div>
</article>
