title: WeruLux — Your Jet Lag Manager & Travel Companion
description: >-
  WeruLux is the travel companion that plans around your body clock to beat jet
  lag, with personalized sleep, light and recovery plans for every flight.
url: "https://werulux.com"

# Jekyll build settings
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: blog/feed.xml

exclude:
  - README.md
  - _backup
  - vendor
  - Gemfile
  - Gemfile.lock
