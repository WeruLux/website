{% assign faq = site.data.faq %}
{% if faq.items and faq.items.size > 0 %}
<!-- FAQ -->
<section class="faq" id="faq">
  <div class="section-inner">
{% unless include.hide_header %}
    <div class="faq-header reveal">
      <div class="section-eyebrow" style="justify-content:center;">
        <div class="eyebrow-line"></div>
        <span class="eyebrow-text">{{ faq.eyebrow }}</span>
        <div class="eyebrow-line"></div>
      </div>
      <h2 class="section-title">{{ faq.title }}</h2>
    </div>
{% endunless %}

    <div class="faq-list reveal reveal-delay-1">
      {% for item in faq.items %}
      <details class="faq-item">
        <summary class="faq-q">
          <span>{{ item.question }}</span>
          <span class="faq-icon" aria-hidden="true"></span>
        </summary>
        <div class="faq-a"><p>{{ item.answer }}</p></div>
      </details>
      {% endfor %}
    </div>
  </div>
</section>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {% for item in faq.items %}{
      "@type": "Question",
      "name": {{ item.question | jsonify }},
      "acceptedAnswer": { "@type": "Answer", "text": {{ item.answer | strip_html | normalize_whitespace | jsonify }} }
    }{% unless forloop.last %},{% endunless %}{% endfor %}
  ]
}
</script>
{% endif %}
