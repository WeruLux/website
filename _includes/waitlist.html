{% assign wl = site.data.waitlist %}
{% if wl.endpoint and wl.endpoint != "" %}
<!-- WAITLIST -->
<section class="waitlist" id="waitlist">
  <div class="section-inner waitlist-inner">
    <div class="waitlist-content reveal">
      <div class="section-eyebrow" style="justify-content:center;">
        <div class="eyebrow-line"></div>
        <span class="eyebrow-text">Early Access</span>
        <div class="eyebrow-line"></div>
      </div>
      <h2 class="section-title">{{ wl.headline }}</h2>
      <p class="waitlist-text">{{ wl.text }}</p>
      <form class="waitlist-form" id="waitlistForm" action="{{ wl.endpoint }}" method="POST">
        <label for="wl-email" class="visually-hidden">Email address</label>
        <input type="email" id="wl-email" name="EMAIL" required placeholder="you@example.com" autocomplete="email">
        {% comment %} Brevo bot-protection honeypot + locale, expected by sibforms endpoints {% endcomment %}
        <input type="text" name="email_address_check" value="" class="visually-hidden" tabindex="-1" aria-hidden="true">
        <input type="hidden" name="locale" value="en">
        <input type="hidden" name="html_type" value="simple">
        <input type="hidden" name="confirmationRedirectUrl" value="{{ '/thanks/' | absolute_url }}">
        <button type="submit" class="waitlist-submit">{{ wl.button_label }}</button>
      </form>
    </div>
  </div>
</section>
{% endif %}
