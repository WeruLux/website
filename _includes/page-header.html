<header class="page-head">
  <div class="page-head-inner reveal">
    <div class="section-eyebrow" style="justify-content:center;">
      <div class="eyebrow-line"></div>
      <span class="eyebrow-text">{{ include.eyebrow }}</span>
      <div class="eyebrow-line"></div>
    </div>
    <h1 class="page-head-title">{{ include.title }}</h1>
    {% if include.intro %}<p class="page-head-intro">{{ include.intro }}</p>{% endif %}
  </div>
</header>
